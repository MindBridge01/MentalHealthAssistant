name: Mind Bridge CI/CD
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/synthetic
      CHATBOT_DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/synthetic
      JWT_SECRET: synthetic-ci-signing-secret-at-least-32-characters
      PHI_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GEMINI_API_KEY: ''
      SMTP_PASSWORD: ''
      FRONTEND_AUTOSTART: 'false'
      CHATBOT_AUTOSTART: 'false'
      EMAIL_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            chatbot/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm ci --prefix chatbot
      - run: npm run lint
      - run: npm --prefix server run test:ci
      - run: npm --prefix chatbot test
      - run: node --test deploy/tests/*.test.mjs
      - run: npm run build
        env:
          NODE_ENV: production

  images:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.names.outputs.prefix }}
      app_digest: ${{ steps.app.outputs.digest }}
      models_digest: ${{ steps.models.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - id: names
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: app
        with:
          context: .
          file: deploy/app.Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          load: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.names.outputs.prefix }}-app:${{ github.sha }}
            ${{ steps.names.outputs.prefix }}-app:bootstrap
          build-args: RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Verify production startup against isolated PostgreSQL
        env:
          MINDBRIDGE_TEST_IMAGE: ${{ (github.ref != 'refs/heads/main' || github.event_name == 'pull_request') && format('{0}-app:{1}', steps.names.outputs.prefix, github.sha) || format('{0}-app@{1}', steps.names.outputs.prefix, steps.app.outputs.digest) }}
          CONTAINER_SHA: ${{ github.sha }}
        run: |
          docker compose -p mindbridge-ci -f deploy/compose.smoke.yaml --env-file /dev/null up --detach --wait web
          node deploy/container-check.mjs
      - name: Remove synthetic integration containers
        if: always()
        env:
          MINDBRIDGE_TEST_IMAGE: ${{ steps.names.outputs.prefix }}-app:${{ github.sha }}
        run: docker compose -p mindbridge-ci -f deploy/compose.smoke.yaml --env-file /dev/null down --volumes
      - uses: docker/build-push-action@v6
        id: models
        with:
          context: chatbot/model-service
          file: chatbot/model-service/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.names.outputs.prefix }}-models:${{ github.sha }}
            ${{ steps.names.outputs.prefix }}-models:bootstrap
          build-args: RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=models
          cache-to: type=gha,mode=max,scope=models

  production:
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ec2-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: mindbridge-${{ github.run_id }}
      - name: Deploy immutable images through Systems Manager
        run: node deploy/ec2.mjs
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.sha }}
          APP_IMAGE: ${{ needs.images.outputs.prefix }}-app@${{ needs.images.outputs.app_digest }}
          MODELS_IMAGE: ${{ needs.images.outputs.prefix }}-models@${{ needs.images.outputs.models_digest }}
      - name: Verify public HTTPS deployment
        run: node deploy/smoke.mjs
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_SHA: ${{ github.sha }}

